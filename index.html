<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>smart-data-table</title>

  <link rel="stylesheet" href="./src/index.css" />
  <script type="module" src="/src/smart-data-table.ts"></script>
</head>

<body>
  <smart-data-table id="table" sortable="age,role" page-size="3" show-search="true"></smart-data-table>
  <smart-data-table id="table2" page-size="2"></smart-data-table>
  <smart-data-table api="https://jsonplaceholder.typicode.com/users" page-size="5" show-search="true"
    hidden-columns="company,id"></smart-data-table>

  <script type="module">
    const table = document.querySelector('#table');

    const data = [
      { id: 1, name: 'Alice', age: 22, role: 'Developer', country: 'Romania' },
      { id: 2, name: 'Bob', age: 25, role: 'Designer', country: 'Germany' },
      { id: 3, name: 'Charlie', age: 30, role: 'Manager', country: 'UK' },
      { id: 4, name: 'David', age: 28, role: 'Developer', country: 'USA' },
      { id: 5, name: 'Eve', age: 26, role: 'QA Engineer', country: 'France' },
      { id: 6, name: 'Frank', age: 24, role: 'DevOps', country: 'Italy' },
      { id: 7, name: 'Grace', age: 27, role: 'Product Owner', country: 'Spain' },
    ];

    const table2 = document.querySelector('#table2');

    const data2 = [
      { id: 1, name: 'Lionel Messi', age: 34, team: 'Paris Saint-Germain', position: 'Forward' },
      { id: 2, name: 'Cristiano Ronaldo', age: 36, team: 'Manchester United', position: 'Forward' },
      { id: 3, name: 'Neymar Jr.', age: 29, team: 'Paris Saint-Germain', position: 'Forward' },
      { id: 4, name: 'Kylian Mbappé', age: 22, team: 'Paris Saint-Germain', position: 'Forward' },
      { id: 5, name: 'Kevin De Bruyne', age: 30, team: 'Manchester City', position: 'Midfielder' },
    ];

    table.data = data;
    table.title = 'Employees';
    table2.data = data2;
    table2.title = 'Players';
  </script>
</body>

</html>
